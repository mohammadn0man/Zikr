name: Zikr
options:
  bundleIdPrefix: com.mohammadnoman
  minimumwatchOSVersion: 11.0
targets:
  Zikr:
    type: application
    platform: iOS
    sources:
      - ZikrContainer
    info:
      path: ZikrContainer/Info.plist
    settings:
      base:
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadn0man.zikrcounter
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: L8SBQ2K5W8
    dependencies:
      - target: Zikr Watch App
        embed: true
    configs:
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Zikr iOS Container Profile"

  Zikr Watch App:
    type: application
    platform: watchOS
    sources:
      - Zikr Watch App
      - path: ZikrWidget/ZikrWidgetIntent.swift
    dependencies:
      - target: ZikrWidget
        embed: true
        codeSign: true
    info:
      path: Zikr Watch App/Info.plist
    settings:
      base:
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKSupportsAlwaysOnDisplay: YES
        INFOPLIST_KEY_UIBackgroundModes: mindfulness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadn0man.zikrcounter.watchkitapp
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: L8SBQ2K5W8
        CODE_SIGN_ENTITLEMENTS: Zikr Watch App/Zikr Watch App.entitlements
    configs:
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Zikr Main AppStore Profile"

  ZikrWidget:
    type: app-extension
    platform: watchOS
    sources: ZikrWidget
    info:
      path: ZikrWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.mohammadn0man.zikrcounter.watchkitapp.ZikrWidget
        INFOPLIST_KEY_CFBundleDisplayName: Zikr
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: L8SBQ2K5W8
        CODE_SIGN_ENTITLEMENTS: ZikrWidget/ZikrWidget.entitlements
    configs:
      Release:
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Zikr Widget AppStore Profile"

  Zikr Watch AppTests:
    type: bundle.unit-test
    platform: watchOS
    sources: Zikr Watch AppTests
    dependencies:
      - target: Zikr Watch App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0

  Zikr Watch AppUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: Zikr Watch AppUITests
    dependencies:
      - target: Zikr Watch App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
